<circle cx="240" cy="240" r="120" fill="url(#hub)"/>
<line x1="240" y1="240" x2="240.0" y2="75.0" class="edge" style="animation-delay:0.0s"/><line x1="240" y1="240" x2="382.9" y2="157.5" class="edge" style="animation-delay:0.4s"/><line x1="240" y1="240" x2="382.9" y2="322.5" class="edge" style="animation-delay:0.8s"/><line x1="240" y1="240" x2="240.0" y2="405.0" class="edge" style="animation-delay:1.2s"/><line x1="240" y1="240" x2="97.1" y2="322.5" class="edge" style="animation-delay:1.6s"/><line x1="240" y1="240" x2="97.1" y2="157.5" class="edge" style="animation-delay:2.0s"/>
