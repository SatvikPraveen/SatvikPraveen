<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="title desc">
<title id="title">Areas of Interest</title>
<desc id="desc">Medical AI at the hub, connected to applied ML, computer vision, multimodal AI, NLP and LLMs, analytics, and deployment.</desc>
<defs>
  <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity=".35"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <style>
    .edge { stroke: #38bdf8; stroke-width: 1.4; stroke-dasharray: 4 7; stroke-opacity: .6; animation: dash 2.4s linear infinite; }
    .ring { fill: none; stroke: #30363d; stroke-dasharray: 2 6; }
    .box  { fill: #161b22; stroke: #30363d; }
    .dot  { fill: url(#accent); }
    .l1   { font: 600 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .l2   { font: 400 10.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .hubc { fill: #161b22; stroke: url(#accent); stroke-width: 2.5; }
    .hub1 { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .hub2 { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .star { fill: #38bdf8; opacity: .35; animation: twinkle 5s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    @keyframes twinkle { 0%,100% { opacity:.15 } 50% { opacity:.6 } }
  </style>
</defs>
<rect width="480" height="480" rx="20" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="479" height="479" rx="20" fill="none" stroke="#30363d"/>
