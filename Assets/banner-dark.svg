  </pattern>
  <clipPath id="clip"><rect width="1200" height="300" rx="18"/></clipPath>
  <style>
    .name { font: 700 54px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; letter-spacing: -0.5px; }
    .tag  { font: 500 21px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; opacity: .92; }
    .sub  { font: 400 15.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .edge { stroke: #38bdf8; stroke-width: 1.2; stroke-opacity: .35; animation: edgePulse 4s ease-in-out infinite; }
    .node { fill: #2dd4bf; stroke: #0d1117; stroke-width: 2; animation: nodePulse 3s ease-in-out infinite; }
    @keyframes edgePulse { 0%,100% { stroke-opacity:.25 } 50% { stroke-opacity:.6 } }
    @keyframes nodePulse { 0%,100% { opacity:.7 } 50% { opacity:1 } }
  </style>
</defs>
